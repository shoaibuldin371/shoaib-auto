name: Manual IMAP Replies Trigger (Scheduled via cron-job.org)

on:
  workflow_dispatch:

jobs:
  outreach-replies:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger IMAP Reply Scanner
        run: |
          curl -s -X POST "${{ secrets.VERCEL_APP_URL }}/api/cron/replies" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
