name: Scheduled Send (Every 30m, 10-18 PKT, Mon-Sat)

on:
  schedule:
    - cron: '*/30 5-13 * * 1-6'
  workflow_dispatch:

jobs:
  outreach-send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Send Batch
        run: |
          curl -s -X POST "${{ secrets.VERCEL_APP_URL }}/api/cron/send" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
