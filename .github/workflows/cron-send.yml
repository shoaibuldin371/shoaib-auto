name: ReachOut Scheduled Send Trigger

on:
  schedule:
    # 05:00 UTC and 11:00 UTC corresponds to 10:00 and 16:00 Asia/Karachi
    - cron: '0 5,11 * * *'
  workflow_dispatch:

jobs:
  trigger-send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Outreach Send Endpoint
        run: |
          curl -s -X POST "${{ secrets.VERCEL_APP_URL }}/api/cron/send" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
